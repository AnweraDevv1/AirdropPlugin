# AirdropPlugin Configuration

# Interval between automatic airdrops in minutes (default: 30)
airdrop-interval: 30

# Time players must wait before opening the airdrop in minutes (default: 3)
wait-time: 3

# Time before the airdrop disappears after it's ready to open in seconds (default: 90)
despawn-time: 90

# World border safety margin (blocks from border)
border-safety-margin: 50

# Loot settings
loot:
  # Minimum number of items in airdrop
  min-items: 5
  # Maximum number of items in airdrop
  max-items: 10
  
  # Possible loot items with weights (higher weight = more common)
  items:
    - material: DIAMOND
      amount: 5
      weight: 20
    - material: EMERALD
      amount: 8
      weight: 25
    - material: NETHERITE_INGOT
      amount: 1
      weight: 5
